name: Build and deploy ASP.Net Core app to Azure Web App - customermicroservice-ty2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      
      - name: Restore dependencies
        run: dotnet restore CustomerMicroservice/CustomerMicroservice.csproj
      
      - name: Build
        run: dotnet build CustomerMicroservice/CustomerMicroservice.csproj --configuration Release --no-restore
      
      - name: Publish
        run: dotnet publish CustomerMicroservice/CustomerMicroservice.csproj -c Release -r linux-x64 --self-contained false -o publish
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'customermicroservice-8824576'
          package: publish
          publish-profile: ${{ secrets.AZURE_CUSTOMERMICROSERVICE_PUBLISH_PROFILE }}